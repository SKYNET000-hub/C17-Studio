<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><link rel="manifest" href="/manifest.webmanifest"><title>C17 Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}header{height:68px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20222a;background:#0b0c11;position:sticky;top:0;z-index:5}.brand{font-weight:800;letter-spacing:.14em}.brand small{opacity:.45;font-weight:500}.pill{border:1px solid #292c36;background:#12141b;color:#ddd;border-radius:999px;padding:9px 13px}.grid{display:grid;grid-template-columns:1fr;gap:12px;padding:14px;max-width:1100px;margin:auto}.panel{background:#101219;border:1px solid #20232c;border-radius:18px;padding:14px;box-shadow:0 10px 30px #0004}.top{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hero{padding:18px}.status{font-size:12px;color:#8f96a5;text-transform:uppercase;letter-spacing:.12em}.title{font-size:25px;font-weight:800;margin:5px 0 8px}.meter{height:12px;background:#20232c;border-radius:8px;overflow:hidden}.meter i{display:block;height:100%;width:35%;background:linear-gradient(90deg,#7b5cff,#d2b4ff);box-shadow:0 0 18px #8b6cff88}.controls{display:flex;gap:8px;flex-wrap:wrap}.primary{background:#f4f4f4;color:#08090d;border:0;font-weight:800}.danger{background:#2b1218;color:#ffb9c3;border-color:#5a202c}.channels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ch h3{margin:0 0 8px}.knob{display:flex;align-items:center;justify-content:space-between;margin:9px 0}.knob input{width:58%}.row{display:flex;gap:7px}.mini{padding:8px 10px;border-radius:10px;border:1px solid #2a2d37;background:#171922;color:#eee}.mini.active{background:#29213f;border-color:#7557d6}.section-title{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#9096a4;margin-bottom:10px}.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.preset{padding:10px;border:1px solid #292c36;border-radius:12px;background:#151720;text-align:left;color:#eee}.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slider{accent-color:#9b7cff}.live{display:flex;justify-content:space-between;align-items:center}.live strong{font-size:20px}.small{font-size:12px;color:#8f96a5;line-height:1.45}@media(min-width:760px){.grid{grid-template-columns:1.5fr 1fr}.top{grid-column:1/-1}.wide{grid-column:1/-1}.channels{grid-template-columns:repeat(3,1fr)}.presets{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><div class="brand">C17 <small>STUDIO</small></div><button class="pill" id="tiktok">● TikTok verbinden</button></header><main class="grid"><section class="panel hero top"><div><div class="status">Audio Engine</div><div class="title" id="state">READY</div><div class="meter"><i id="meter"></i></div></div><div class="controls"><button class="pill primary" id="start">START</button><button class="pill danger" id="stop">STOP</button><button class="pill" id="record">● REC</button></div></section>
<section class="panel wide"><div class="section-title">Channels</div><div class="channels" id="channels"></div></section>
<section class="panel"><div class="section-title">Master</div><div class="knob">Volume <input class="slider" id="master" type="range" min="0" max="1" step=".01" value=".8"></div><div class="knob">Bass <input class="slider" id="bass" type="range" min="-12" max="12" value="0"></div><div class="knob">Mid <input class="slider" id="mid" type="range" min="-12" max="12" value="0"></div><div class="knob">Treble <input class="slider" id="treble" type="range" min="-12" max="12" value="0"></div></section>
<section class="panel"><div class="section-title">FX</div><div class="fx"><button class="mini" data-fx="warm">Warm</button><button class="mini" data-fx="radio">Radio</button><button class="mini" data-fx="deep">Deep</button><button class="mini" data-fx="robot">Robot</button><button class="mini" data-fx="space">Space</button><button class="mini" data-fx="studio">Studio</button></div></section>
<section class="panel wide"><div class="section-title">Voice Presets · 100</div><div class="presets" id="presets"></div></section>
<section class="panel wide live"><div><div class="section-title">TikTok Live</div><strong id="liveState">Offline</strong><div class="small">C17 verarbeitet Audio lokal im Browser. TikTok OAuth wird über den Server abgesichert.</div></div><button class="pill primary" id="live">GO LIVE</button></section></main><script>
const $=s=>document.querySelector(s), channels=[['HOST','Mic 1'],['MOD 1','Mic 2'],['MOD 2','Mic 3']]; const chbox=$('#channels');
channels.forEach((c,i)=>{chbox.insertAdjacentHTML('beforeend',`<div class="panel ch"><h3>${c[0]}</h3><div class="small">${c[1]}</div><div class="knob">Gain <input class="slider gain" data-i="${i}" type="range" min="0" max="1" step=".01" value=".75"></div><div class="row"><button class="mini mute" data-i="${i}">MUTE</button><button class="mini solo" data-i="${i}">SOLO</button></div></div>`)})
const presetNames=['Clean','Warm','Deep','Radio','Broadcast','Studio','Telephone','Vintage','Bright','Dark','Air','Bass','Presence','Soft','Crisp','Velvet','Room','Club','Noir','Podcast']; const p=$('#presets'); for(let i=0;i<100;i++){let n=presetNames[i%presetNames.length]+(i>=presetNames.length?' '+(Math.floor(i/presetNames.length)+1):''); p.insertAdjacentHTML('beforeend',`<button class="preset" data-p="${i}">${String(i+1).padStart(2,'0')} · ${n}</button>`)}
let audio,stream,source,master,rec,chunks=[]; async function start(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});audio=new AudioContext();source=audio.createMediaStreamSource(stream);master=audio.createGain();master.gain.value=+$('#master').value;source.connect(master).connect(audio.destination);$('#state').textContent='RUNNING';$('#meter').style.width='72%';}catch(e){alert('Mikrofonzugriff wurde nicht erlaubt oder ist auf diesem Gerät nicht verfügbar.')}} $('#start').onclick=start; $('#stop').onclick=()=>{stream?.getTracks().forEach(t=>t.stop());audio?.close();$('#state').textContent='READY';$('#meter').style.width='10%'}; $('#master').oninput=e=>{if(master)master.gain.value=+e.target.value};
$('#record').onclick=()=>{if(!stream)return start().then(()=>$('#record').click()); if(!rec){chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'audio/webm'}));a.download='C17-session.webm';a.click();rec=null};rec.start();$('#record').textContent='■ SAVE';}else{rec.stop();$('#record').textContent='● REC'}};
document.querySelectorAll('.mute').forEach(b=>b.onclick=()=>b.classList.toggle('active'));document.querySelectorAll('.solo').forEach(b=>b.onclick=()=>b.classList.toggle('active'));document.querySelectorAll('.fx .mini').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fx .mini').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
$('#tiktok').onclick=()=>location.href='/auth/tiktok'; $('#live').onclick=()=>{if(!$('#liveState').textContent.includes('LIVE')){$('#liveState').textContent='LIVE';$('#live').textContent='STOP LIVE';}else{$('#liveState').textContent='Offline';$('#live').textContent='GO LIVE'}}; if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js'); fetch('/api/tiktok/status').then(r=>r.json()).then(x=>{if(x.connected)$('#tiktok').textContent='● TikTok verbunden'}); if(new URLSearchParams(location.search).get('tiktok')==='connected')$('#tiktok').textContent='● TikTok verbunden';
</script></body></html>
